<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Roblox Univers Winter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: one centered night-sky stage; logo floats in, title rises beneath it, snow falls across everything. */
:root {
  --night-0: #07142b;
  --night-1: #0e2a52;
  --ice: #cfeaff;
  --frost: #7cc4f2;
  --santa: #e5262f;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night-0);
  color: var(--ice);
  font-family: var(--font-body);
  margin: 0;
  padding: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stage {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 0;
  overflow: hidden;
  background: linear-gradient(180deg, #040b1d 0%, #0a1f45 42%, #1a4a7c 74%, #3d7aa8 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 3.5vmin, 40px);
  isolation: isolate;
}
.snow { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.ground {
  position: absolute; left: -10%; right: -10%; bottom: -18%; height: 34%;
  background: radial-gradient(70% 100% at 50% 100%, #eef7ff 0%, #cfe6fa 55%, transparent 72%);
  border-radius: 50% 50% 0 0;
  z-index: 1;
  animation: rise 2.4s cubic-bezier(.2,.8,.2,1) both;
}

.scene { position: absolute; inset: 0; z-index: 0; pointer-events: none; animation: fade 1.6s ease both; }
.stars span { position: absolute; border-radius: 50%; background: #fff; opacity: .2; animation: tw var(--d, 3s) ease-in-out var(--dl, 0s) infinite; }
.moon {
  position: absolute; top: 7%; right: 11%;
  width: clamp(48px, 9vmin, 120px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 38% 36%, #ffffff 0%, #eaf4ff 55%, #cfe3f7 100%);
  box-shadow: 0 0 40px 14px rgba(207,234,255,.35), 0 0 140px 60px rgba(124,196,242,.2);
}
.aurora { position: absolute; left: -10%; width: 120%; filter: blur(38px); mix-blend-mode: screen; opacity: .8; }
.aurora.a1 { top: 4%; height: 38%;
  background: linear-gradient(100deg, transparent 8%, rgba(70,255,190,.38) 32%, rgba(110,150,255,.34) 58%, rgba(190,120,255,.22) 76%, transparent 92%);
  animation: drift 14s ease-in-out infinite alternate; }
.aurora.a2 { top: 14%; height: 28%;
  background: linear-gradient(80deg, transparent 15%, rgba(120,230,255,.28) 40%, rgba(80,255,170,.3) 66%, transparent 88%);
  animation: drift 18s ease-in-out -6s infinite alternate-reverse; }
.landscape { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.window { animation: flicker 3.4s ease-in-out infinite; }
@keyframes tw { 0%,100% { opacity: .15; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.3); } }
@keyframes drift { from { transform: translateX(-6%) skewX(-6deg); opacity: .55; } to { transform: translateX(6%) skewX(5deg); opacity: .95; } }
@keyframes flicker { 0%,100% { opacity: 1; } 45% { opacity: .78; } 60% { opacity: 1; } }
.logo-wrap {
  position: relative;
  z-index: 2;
  width: min(52vmin, 680px);
  aspect-ratio: 1;
  animation: drop 1.6s cubic-bezier(.22,1.2,.36,1) .3s both;
}
.logo-wrap::before {
  content: "";
  position: absolute; inset: 8%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(207,234,255,.55), transparent 68%);
  filter: blur(14px);
  animation: pulse 3.2s ease-in-out 1.6s infinite;
}
.logo {
  position: relative;
  width: 100%; height: 100%;
  display: block;
  animation: bob 4.2s ease-in-out 1.9s infinite;
  filter: drop-shadow(0 10px 22px rgba(0,0,0,.35));
}
.sparkle {
  position: absolute;
  width: 2.2vmin; height: 2.2vmin; min-width: 12px; min-height: 12px;
  background: #fff;
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  opacity: 0;
  animation: twinkle 2.6s ease-in-out infinite;
}
.s1 { left: 10%; top: 24%; animation-delay: 1.8s; }
.s2 { right: 8%; top: 40%; animation-delay: 2.5s; width: 10px; height: 10px; }
.s3 { left: 30%; bottom: 10%; animation-delay: 3.1s; width: 12px; height: 12px; }
h1 {
  position: relative;
  z-index: 2;
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.7rem, min(7.4vw, 8vmin), 5.5rem);
  letter-spacing: .06em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.1;
  text-wrap: balance;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0 .35em;
  text-shadow: 0 4px 18px rgba(124,196,242,.45);
}
h1 .w { display: inline-flex; }
h1 .c {
  display: inline-block;
  background: linear-gradient(180deg, #ffffff 20%, var(--frost) 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  animation: letter .7s cubic-bezier(.2,.9,.3,1.3) both;
  animation-delay: calc(1.5s + var(--i) * 70ms);
}
.sub {
  position: relative; z-index: 2;
  margin: 0;
  font-size: clamp(.75rem, 2.2vmin, 1.4rem);
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--frost);
  animation: fade 1s ease 2.9s both;
}
.replay {
  position: absolute; z-index: 4;
  right: 12px; bottom: 12px;
  font: 500 .8rem var(--font-body);
  color: var(--ice);
  background: rgba(7,20,43,.7);
  border: 1px solid rgba(207,234,255,.35);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
}
.replay:hover { background: rgba(14,42,82,.9); }
.replay:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
@keyframes drop { from { opacity: 0; transform: translateY(-60px) scale(.7) rotate(-14deg); } to { opacity: 1; transform: none; } }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-9px) rotate(1.6deg); } }
@keyframes pulse { 0%,100% { opacity: .55; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.08); } }
@keyframes letter { from { opacity: 0; transform: translateY(18px) scale(.8); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { transform: translateY(40%); } to { transform: none; } }
@keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: .95; transform: scale(1) rotate(45deg); } }
@media (prefers-reduced-motion: reduce) {
  .logo-wrap, .logo, .logo-wrap::before, .scene, .aurora, .window, .stars span, h1 .c, .sub, .sparkle { animation: none !important; opacity: 1; }
  .sparkle { opacity: 0; }
}
</style>

  <h1 id="title" aria-label="Roblox Univers"></h1>
  <p class="sub">Winter Edition</p>
  <button class="replay" id="replay" type="button">Putar ulang</button>
</main>

<script>
(function () {
  var title = document.getElementById('title');
  var words = ['Roblox', 'Univers'];
  var idx = 0;
  function buildTitle() {
    title.textContent = '';
    idx = 0;
    words.forEach(function (w) {
      var wEl = document.createElement('span');
      wEl.className = 'w';
      wEl.setAttribute('aria-hidden', 'true');
      w.split('').forEach(function (ch) {
        var c = document.createElement('span');
        c.className = 'c';
        c.style.setProperty('--i', idx++);
        c.textContent = ch;
        wEl.appendChild(c);
      });
      title.appendChild(wEl);
    });
  }
  buildTitle();

  /* Stars */
  var starBox = document.getElementById('stars');
  for (var k = 0; k < 110; k++) {
    var st = document.createElement('span');
    var sz = Math.random() * 2.2 + 0.8;
    st.style.cssText = 'left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 52) + '%;width:' + sz + 'px;height:' + sz + 'px;--d:' + (2 + Math.random() * 4) + 's;--dl:' + (Math.random() * 4) + 's';
    starBox.appendChild(st);
  }

  /* Snowfall */
  var canvas = document.getElementById('snow');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var flakes = [], W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize() {
    var r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(W * H / 5500);
    flakes = [];
    for (var i = 0; i < n; i++) flakes.push(make(true));
  }
  function make(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -10,
      r: Math.random() * 2.6 + 0.8,
      vy: Math.random() * 0.7 + 0.35,
      sway: Math.random() * 1.2 + 0.3,
      ph: Math.random() * 6.28,
      a: Math.random() * 0.5 + 0.45
    };
  }
  var t = 0;
  function frame() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.vy;
      f.x += Math.sin(t * f.sway + f.ph) * 0.35;
      if (f.y > H + 6) { flakes[i] = make(false); continue; }
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')';
      ctx.arc(f.x, f.y, f.r, 0, 6.283);
      ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  frame();
  if (reduce) { ctx.clearRect(0, 0, W, H); flakes.forEach(function (f) { ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill(); }); }

  /* Replay: restart the CSS animations */
  document.getElementById('replay').addEventListener('click', function () {
    var els = stage.querySelectorAll('.logo-wrap, .logo, .ground, .sub, .sparkle');
    buildTitle();
    els.forEach(function (el) { el.style.animation = 'none'; });
    void stage.offsetWidth;
    els.forEach(function (el) { el.style.animation = ''; });
  });
})();
</script>
